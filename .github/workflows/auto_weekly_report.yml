name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Thursday at 11:59 PM IST
    - cron: '29 18 * * 4'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab matplotlib

      - name: Generate Weekly PDF Report
        run: |
          python generate_report.py weekly

      - name: Archive and Commit Report
        run: |
          mkdir -p weekly_reports

          shopt -s nullglob
          files=( *_Weekly_Progress_Report_Form-3_*.pdf )

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No PDF was generated."
            exit 1
          fi

          mv "${files[@]}" weekly_reports/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weekly_reports/

          if git diff --staged --quiet; then
            echo "No new report to commit."
          else
            git commit -m "docs: archive weekly Form-3 report [skip ci]"
            git push
          fi
